<!doctype html>
<html class="light">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/src/grok.css">
    <style>
      :root {
        --fg-invert: #2d353b;
        --surface-base: #fff;
        --surface-l1: #fafafa;
        --sidebar-background: 240 5.9% 10%;
        --warm-white: 20 13% 95.5%;
        --wd-composer-bg: 0 0% 100%;
        --foreground: #fff;
      }
      .cta { background: white; color: var(--fg-invert); }
      .canvas { background: var(--surface-base); color: var(--foreground); }
      .nav { background: hsl(var(--sidebar-background)); }
    </style>
  </head>
  <body class="wd-refresh bg-surface-base text-fg-primary">
    <div class="dark" data-sidebar="sidebar">
      <nav class="nav bg-sidebar">Library</nav>
    </div>
    <main class="canvas">
      <button class="cta">Try for $0.00</button>
      <pre class="shiki"><code><span style="color:#8da101">const</span> answer = 42;</code></pre>
    </main>
  </body>
</html>
