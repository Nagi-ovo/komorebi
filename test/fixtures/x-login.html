<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>X login fixture</title>
  </head>
  <body>
    <!-- Excerpted from the live x.com logged-out landing (SSR, 2026-08-22).
         Labels localize; data-icon values are hardcoded on the SVG components. -->
    <h1>Happening now.</h1>
    <div class="flex w-full max-w-96 flex-col gap-5">
      <div class="cursor-progress rounded-full">
        <span class="flex items-center justify-center rounded-full bg-black px-6 py-3 font-medium text-white dark:bg-slate-50 dark:text-black">
          <svg data-icon="icon-phone-stroke" viewBox="0 0 24 24" role="img" aria-hidden="true"></svg>
          <span class="text-base">Continue with phone</span>
        </span>
      </div>
      <div class="flex h-10 w-full items-center justify-center overflow-hidden rounded-full border bg-white">
        <svg data-icon="icon-logo-google" viewBox="0 0 24 24" role="img" aria-hidden="true"></svg>
        <span>Continue with Google</span>
      </div>
      <div class="cursor-progress rounded-full">
        <span class="flex items-center justify-center rounded-full border bg-white">
          <svg data-icon="icon-logo-apple" viewBox="0 0 24 24" role="img" aria-hidden="true"></svg>
          <span class="text-base">Continue with Apple</span>
        </span>
      </div>
      <div class="rounded-legacy relative flex w-full flex-col justify-end border-2 border-gray-300 bg-white p-2 dark:border-zinc-700 dark:bg-black dark:text-white">
        <span>Email or username</span>
      </div>
    </div>
  </body>
</html>
